# ============================================================
# Local dev stack: standard PostgreSQL + API + Web.
# Run from repo root:  docker compose -f docker/docker-compose.yml up
# ============================================================
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashpro
    ports:
      - "5432:5432"
    volumes:
      - cashpro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cashpro
      WEB_ORIGIN: http://localhost:3000
      # Leave CLERK_SECRET_KEY unset to use the x-company-id dev fallback.
      DEV_COMPANY_ID: ${DEV_COMPANY_ID:-}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  cashpro_pgdata:
